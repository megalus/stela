[project]
name = "stela"
dynamic = ["version"]
description = "Organize your project settings and secrets with ease"
readme = "README.md"
requires-python = ">=3.11,<4.0"
license = "MIT"
authors = [{ name = "Chris Maillefaud", email = "chrismaille@users.noreply.github.com" }]
keywords = ["settings", "configuration", "parser", "dotenv", "environment"]
classifiers = [
    "Intended Audience :: Developers",
    "Development Status :: 4 - Beta",
    "Environment :: Plugins",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "click",
    "loguru",
    "python-dotenv",
    "toml",
    "tomlkit",
]

[project.urls]
Repository = "https://github.com/megalus/stela"
Documentation = "https://megalus.github.io/stela/"

[project.scripts]
stela = "stela.cmd.stela_cmd:cli"

[dependency-groups]
dev = [
    "auto-changelog",
    "bandit",
    "coverage",
    "django",
    "fastapi",
    "mkdocs-material",
    "mkdocs-mermaid2-plugin",
    "mypy",
    "pre-commit",
    "pydantic-settings",
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "pytest-mock",
    "pytest-mypy",
    "pytest-pydocstyle",
    "pytest-xdist",
    "ruff",
    "yamllint",
]

[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "stela/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["stela"]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = [
    ".eggs",
    ".git",
    ".hg",
    ".mypy_cache",
    ".tox",
    ".venv",
    "venv",
    ".aws-sam",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "lf"

[tool.stela]
config_file_path = "./tests/fixtures"
default_environment = "test"

[tool.semantic_release]
version_variables = ["stela/__init__.py:__version__"]
branch = "main"
build_command = "uv build"
